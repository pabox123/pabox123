name: Generate snake

on:
  # runs every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:
  # runs on every push to the default branch (change "main" if yours is "master")
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # builds the snake animation from your contribution graph
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=4044c4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=7c83ff

      # pushes the SVGs to a branch called "output"
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}